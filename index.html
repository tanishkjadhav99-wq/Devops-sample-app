<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX FIT | Unleash Your Potential</title>
    <!-- Google Fonts & FontAwesome for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Global Reset & Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #121212;
            color: #f4f4f4;
            overflow-x: hidden;
        }

        /* Header / Navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff5e00;
            letter-spacing: 2px;
        }

        .logo span {
            color: #fff;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: #ccc;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #ff5e00;
        }

        .cart-btn {
            background: #ff5e00;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .cart-btn:hover {
            background: #e05200;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 8%;
            text-align: left;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: #ff5e00;
        }

        .hero p {
            font-size: 18px;
            color: #aaa;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .btn-main {
            display: inline-block;
            background: #ff5e00;
            color: #fff;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 800;
            text-decoration: none;
            border-radius: 5px;
            transition: transform 0.2s, background 0.3s;
        }

        .btn-main:hover {
            background: #e05200;
            transform: translateY(-3px);
        }

        /* Products Section */
        .products-section {
            padding: 100px 8%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 38px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title h2 span {
            color: #ff5e00;
        }

        .section-title p {
            color: #888;
            margin-top: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #252525;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(255, 94, 0, 0.15);
        }

        .product-image {
            height: 250px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ff5e00;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .product-details {
            padding: 25px;
        }

        .product-details h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .product-details p {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
        }

        .btn-buy {
            background: transparent;
            color: #ff5e00;
            border: 2px solid #ff5e00;
            padding: 8px 16px;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-buy:hover {
            background: #ff5e00;
            color: #fff;
        }

        /* Footer */
        footer {
            background: #0d0d0d;
            padding: 50px 8%;
            text-align: center;
            border-top: 1px solid #222;
        }

        footer p {
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">APEX<span>FIT</span></div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <button class="cart-btn"><i class="fa-solid fa-cart-shopping"></i> Cart (0)</button>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <h1>Push
